# SyncBoard — Docker Compose service topology
#
# ─── PROFILES ────────────────────────────────────────────────────────────────
#
#  (no profile)   Core backing services only — Postgres, Redis, RabbitMQ,
#                 MinIO, MailHog. Enough for `npm run start:dev` locally.
#
#  app            Adds: db-init (schema push + optional seed) + app (NestJS
#                 production container).
#                 Use: docker compose --profile app up -d
#
#  full           Adds everything in `app` plus: frontend (React SPA served
#                 by Nginx), postgres-replica, pgbouncer, nginx reverse proxy.
#                 Use: docker compose --profile full up -d
#
# ─── SEEDING ─────────────────────────────────────────────────────────────────
#  Demo data seeding runs by default. To skip seeding:
#    RUN_SEED=false docker compose --profile app up -d
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backing infrastructure ─────────────────────────────────────────────────

  postgres-primary:
    image: postgres:16-alpine
    container_name: syncboard-postgres
    command: >
      postgres -c wal_level=replica -c max_wal_senders=5
               -c max_replication_slots=5 -c hot_standby=on
    environment:
      POSTGRES_USER: syncuser
      POSTGRES_PASSWORD: syncpass
      POSTGRES_DB: syncboard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/replica/01-primary-setup.sh:/docker-entrypoint-initdb.d/01-primary-setup.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncuser -d syncboard']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:16-alpine
    profiles: ['full']
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: syncuser
      POSTGRES_PASSWORD: syncpass
      POSTGRES_DB: syncboard
    ports:
      - '5433:5432'
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica/02-become-replica.sh:/docker-entrypoint-initdb.d/02-become-replica.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncuser']
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncboard-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: syncboard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # `ping` is lightweight and stable during the Erlang/management-plugin boot.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 30s
      retries: 12
      start_period: 60s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: syncboard-mailhog
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/api/v2/messages?limit=1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    container_name: syncboard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'  # S3 API
      - '9001:9001'  # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Creates the default S3 bucket once MinIO is healthy, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ['app', 'full']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/syncboard-files &&
        mc anonymous set download local/syncboard-files
      "

  # ── App profile ────────────────────────────────────────────────────────────

  # Pushes the Prisma schema, applies custom SQL, and optionally seeds data.
  # Runs once per `compose up` and exits — the app service waits for it.
  db-init:
    build: { context: ., target: migration }
    profiles: ['app', 'full']
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://syncuser:syncpass@postgres-primary:5432/syncboard?schema=public
      DB_HOST: postgres-primary
      DB_USER: syncuser
      DB_NAME: syncboard
      RUN_SEED: ${RUN_SEED:-true}

  app:
    build: { context: ., target: production }
    profiles: ['app', 'full']
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://syncuser:syncpass@postgres-primary:5432/syncboard?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_ENABLE: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET: syncboard-files
      S3_FORCE_PATH_STYLE: 'true'
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    ports:
      - '3000:3000'
    volumes:
      - app_keys:/app/keys
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ── Full profile ───────────────────────────────────────────────────────────

  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ['full']
    environment:
      DB_HOST: postgres-primary
      DB_PORT: '5432'
      DB_USER: syncuser
      DB_PASSWORD: syncpass
      DB_NAME: syncboard
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      ADMIN_USERS: syncuser
      AUTH_TYPE: plain
    ports:
      - '6432:5432'
    depends_on:
      postgres-primary:
        condition: service_healthy

  # Builds the React SPA and serves it via Nginx on :80 internally.
  # The edge Nginx proxy routes / to this service.
  frontend:
    build: { context: ./frontend, target: production }
    profiles: ['full']
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    profiles: ['full']
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - frontend

volumes:
  pgdata:
  pg_replica_data:
  rabbitmq_data:
  miniodata:
  app_keys:
