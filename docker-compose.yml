version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncboard-postgres
    environment:
      POSTGRES_USER: syncuser
      POSTGRES_PASSWORD: syncpass
      POSTGRES_DB: syncboard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncuser -d syncboard']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syncboard-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: syncboard-mailhog
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI
    healthcheck:
      # MailHog exposes its HTTP API on :8025; e2e specs poll it for tokens,
      # so CI must wait until it answers before running tests.
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/api/v2/messages?limit=1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: syncboard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # `ping` is the lightweight readiness probe; check_port_connectivity
      # flaps during management-plugin boot and made `compose up --wait` flaky.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  rabbitmq_data:
