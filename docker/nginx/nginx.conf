# docker/nginx/nginx.conf — Edge reverse proxy for the full-profile stack.
#
# Routes:
#   /api/*        → app:3000  (REST, rate-limited)
#   /api/auth/*   → app:3000  (stricter rate limit)
#   /socket.io/*  → app:3000  (WebSocket upgrade)
#   /*            → frontend  (React SPA, catch-all)

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"'
    '}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    limit_req_zone $binary_remote_addr zone=api:10m    rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    # ip_hash pins each client to one backend instance — required while
    # Socket.IO long-polling fallback is enabled.
    upstream app_servers {
        ip_hash;
        server app:3000;
        keepalive 32;
    }

    upstream frontend_servers {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options         "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options  "nosniff"                      always;
        add_header X-XSS-Protection        "1; mode=block"                always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # Health check — no access log noise
        location = /api/health {
            proxy_pass http://app_servers;
            access_log off;
        }

        # Auth endpoints — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # File upload presign endpoint — separate bucket
        location ~* /files/presigned-upload$ {
            limit_req zone=upload burst=5 nodelay;

            proxy_pass         http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
        }

        # REST API
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
        }

        # WebSocket — requires HTTP/1.1 Upgrade handshake
        location /socket.io/ {
            proxy_pass         http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # React SPA catch-all — must be last
        location / {
            proxy_pass         http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
