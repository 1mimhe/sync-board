name: Test Suite

on:
  push:
    branches:
      - master
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: 'postgresql://syncuser:syncpass@localhost:5432/syncboard?schema=public'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_URL: 'amqp://guest:guest@localhost:5672'
      JWT_SECRET: 'e2e-test-secret-key-32-chars-minimum!!'
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      MAILHOG_URL: 'http://localhost:8025'
      MAIL_FROM: 'SyncBoard E2E <no-reply@syncboard.local>'
      MAIL_FROM_NAME: SyncBoard
      CLIENT_URL: 'http://localhost:3001'
      APP_URL: 'http://localhost:3000'
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Start Docker services (Postgres, Redis, MailHog)
        run: docker compose up -d --wait

      - name: Push Prisma schema to test database
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: 'postgresql://syncuser:syncpass@localhost:5432/syncboard?schema=public'

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Teardown Docker services
        if: always()
        run: docker compose down -v
