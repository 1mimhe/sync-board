server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache headers.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other requests fall back to index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
